# Step 7 template-level paraphrase bank (written directly by Claude, no external API call).
# 12 sentences per template; placeholders {OBJn} are kept verbatim, each appears once and is preceded by "the "; meaning unchanged, no added cues.
# Keys: template ID (T2 split by variant: closest / farthest / pair). `template` is the original template sentence (kept in the question's text_template field).
# Revised after review: T2_closest #3, T2_farthest #3 (added "among the options" qualifier), T3 #6 (relative to you);
# after the "option scope" check was added, T2_closest #4 and T2_farthest #4 failed and were minimally changed to "these listed objects" (0-based numbering).

T1:
  template: "What is the distance between the center of the {OBJ1} and the center of the {OBJ2}, in meters?"
  paraphrases:
    - "How far is the center of the {OBJ1} from the center of the {OBJ2}, in meters?"
    - "In meters, how far apart are the center of the {OBJ1} and the center of the {OBJ2}?"
    - "Give the distance in meters from the center of the {OBJ1} to the center of the {OBJ2}."
    - "Measure the distance between the center of the {OBJ1} and the center of the {OBJ2}, and answer in meters."
    - "How many meters separate the center of the {OBJ1} from the center of the {OBJ2}?"
    - "What is the center-to-center distance between the {OBJ1} and the {OBJ2}, in meters?"
    - "Report the distance, in meters, between the center of the {OBJ1} and the center of the {OBJ2}."
    - "Find the distance between the centers of the {OBJ1} and the {OBJ2}, expressed in meters."
    - "What's the distance from the center of the {OBJ1} to the center of the {OBJ2}, measured in meters?"
    - "Tell me how far the center of the {OBJ1} is from the center of the {OBJ2}, in meters."
    - "In meters, what is the distance separating the center of the {OBJ1} and the center of the {OBJ2}?"
    - "How long is the straight line from the center of the {OBJ1} to the center of the {OBJ2}, in meters?"

