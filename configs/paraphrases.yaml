    - "Of the {OBJ2} and the {OBJ3}, which one sits closer to the {OBJ1}?"
    - "Tell me which is closer to the {OBJ1}: the {OBJ2} or the {OBJ3}."
    - "Which object is closer to the {OBJ1}, the {OBJ2} or the {OBJ3}?"
    - "Pick the object that is closer to the {OBJ1}: the {OBJ2} or the {OBJ3}."
    - "Comparing the {OBJ2} and the {OBJ3}, which one is closer to the {OBJ1}?"
    - "Which lies closer to the {OBJ1}: the {OBJ2}, or the {OBJ3}?"
    - "The {OBJ2} or the {OBJ3}: which of the two is closer to the {OBJ1}?"
    - "Decide which of these two is closer to the {OBJ1}: the {OBJ2} or the {OBJ3}."
    - "Of these two, the {OBJ2} and the {OBJ3}, which is closer to the {OBJ1}?"

